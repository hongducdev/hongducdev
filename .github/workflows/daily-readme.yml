name: Daily README

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pick today's idiom and book
        run: node scripts/daily-readme.mjs
      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "hongducdev"
          git config user.email "73995275+hongducdev@users.noreply.github.com"
          git add README.md
          git commit -m "📖 docs(readme): daily idiom and book"
          git push
